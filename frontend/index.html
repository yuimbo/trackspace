<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trackspace</title>
</head>
<body>

<!-- component: sidebar -->
<aside id="sidebar">
  <!-- component: folder-panel (folder list fragment from GET /partials/folder-tree via HTMX) -->
  <section id="folder-section" x-data>
    <h2>Folders</h2>
    <div id="folder-controls">
      <button id="btn-add-root" type="button" title="Add root folder by path">+ Root</button>
    </div>
    <div id="root-drop-hint">Drop folders here to add roots. Drag a root row outside to remove.</div>
    <div id="folder-tree"></div>
  </section>
</aside>

<!-- component: main-viewport -->
<main id="main">
  <button type="button" id="viewport-clear-hides" class="viewport-clear-hides hidden" title="Show all tracks again (Alt+s)">Show all</button>
  <div id="selected-folders-overlay" class="selected-folders-overlay hidden"></div>
  <canvas id="viewport"></canvas>

  <footer id="statusbar">
    <span id="status-text">Select a folder to begin</span>
    <span id="shortcuts-hint"><kbd>F1</kbd> shortcuts</span>
  </footer>
</main>

<!-- component: right-panel -->
<aside id="right-panel">
  <!-- component: search-panel -->
  <section id="search-section" x-data>
    <h2>Search</h2>
    <input
      id="search-input"
      type="search"
      placeholder="Describe the sound…  /"
      spellcheck="false"
      autocomplete="off"
      title="Semantic search over the cached CLAP embeddings"
    />
    <div id="search-results"></div>
  </section>

  <section id="properties-section" x-data>
    <h2>Properties</h2>
    <div id="properties-list"></div>
  </section>

  <section id="batch-section" x-data>
    <h2>Batch Edit</h2>
    <div id="batch-list"></div>
  </section>

  <div class="rp-spacer"></div>

  <section id="options-section" x-data>
    <h2>Options</h2>
    <div class="option-row hover-preview-row">
      <label><input type="checkbox" id="hover-preview-toggle" /> Hover preview <kbd>M</kbd></label>
      <input
        type="range"
        id="hover-preview-volume"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
        title="Preview volume"
        aria-label="Hover preview volume"
      />
      <span id="hover-preview-volume-value" class="option-value"></span>
    </div>
    <label><input type="checkbox" id="view-mode-toggle" /> Embedding space <kbd>E</kbd></label>
    <label class="folder-tune">
      <span>Explode <kbd>X</kbd> + scroll</span>
      <input
        type="range"
        id="explode-strength-range"
        min="0.05"
        max="0.20"
        step="0.01"
        value="0.10"
      />
    </label>
  </section>

  <section id="cluster-section" x-data>
    <h2>Microgenres</h2>
    <label>
      <input type="checkbox" id="cluster-color-toggle" /> Colour by cluster
      <kbd>C</kbd>
    </label>
    <label class="folder-tune">
      <span>Granularity</span>
      <input
        type="range"
        id="cluster-resolution-range"
        min="0"
        max="5"
        step="1"
        value="3"
        title="Leiden resolution: left = broad genres, right = microgenres"
      />
    </label>
    <details id="cluster-weights-details">
      <summary>Source weights</summary>
      <div id="cluster-weights"></div>
      <p id="cluster-weights-note" class="cluster-weights-note"></p>
      <div class="cluster-weight-actions">
        <button
          id="btn-apply-weights"
          type="button"
          title="Re-cluster and re-layout with these weights"
        >
          Apply
        </button>
        <button id="btn-reset-weights" type="button" title="Restore default weights">
          Reset
        </button>
      </div>
    </details>
    <div id="cluster-meta" class="cluster-meta"></div>
    <ul id="cluster-list" class="cluster-list"></ul>
    <button id="btn-rebuild-clusters" type="button" title="Recompute clusters">
      Rebuild clusters
    </button>
    <button
      id="btn-train-supervised"
      type="button"
      title="Train the folder-supervised view (retrains on your folder structure)"
    >
      Train folder view
    </button>
    <details id="head-tools-details">
      <summary>Folder head</summary>
      <div class="head-actions">
        <button
          id="btn-export-head"
          type="button"
          title="Download this library's trained folder head"
        >
          Export
        </button>
        <button id="btn-import-head" type="button" title="Load someone else's head">
          Import
        </button>
        <button id="btn-compare-head" type="button" title="Compare a head with this one">
          Compare
        </button>
        <input type="file" id="head-import-file" accept=".pt" hidden />
        <input type="file" id="head-compare-file" accept=".pt" hidden />
      </div>
      <label class="head-fanout-folder">
        <span>Sort folder</span>
        <input
          id="head-fanout-folder"
          type="text"
          placeholder="e.g. 3f2a/Downloads"
          title="A virtual folder to sort into the head's folder paths"
        />
      </label>
      <div class="cluster-weight-actions">
        <label class="head-fanout-apply">
          <input type="checkbox" id="head-fanout-apply" />
          Move files
        </label>
        <button
          id="btn-fanout-head"
          type="button"
          title="Sort that folder's tracks into the head's folders"
        >
          Fan out
        </button>
      </div>
      <p id="head-note" class="cluster-weights-note"></p>
    </details>
  </section>

  <section id="features-section" x-data>
    <h2 class="features-heading">Features</h2>
    <ul id="feature-list"></ul>
  </section>

  <section id="tag-section" x-data>
    <div id="tag-controls">
      <h2>Tags</h2>
      <button id="btn-add-tag" type="button" title="New tag">+ Tag</button>
    </div>
    <ul id="tag-list"></ul>
  </section>
</aside>

<!-- component: shortcuts-modal (Alpine) -->
<div
  id="shortcuts-modal"
  x-data="{ open: false }"
  x-cloak
  @keydown.window="if ($event.key === 'F1') { $event.preventDefault(); open = true }"
  @keyup.window="if ($event.key === 'F1') open = false"
  @click.self="open = false"
  :class="open ? '' : 'hidden'"
>
  <div id="shortcuts-content">
    <h2>Shortcuts</h2>
    <div id="shortcut-list" class="shortcut-list"></div>
  </div>
</div>

<div id="root-add-modal" class="hidden">
  <div id="root-add-content">
    <h2>Add Root Folder</h2>
    <input id="root-add-input" type="text" placeholder="/absolute/path/to/music" spellcheck="false" />
    <div id="root-add-actions">
      <button id="root-add-cancel" type="button">Cancel</button>
      <button id="root-add-ok" type="button">OK</button>
    </div>
  </div>
</div>

<div id="tooltip" class="tooltip hidden"></div>
<div id="toast-container"></div>
<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <p id="loading-progress"></p>
</div>

<audio id="preview-audio" preload="none"></audio>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
